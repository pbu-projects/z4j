    </g>
  </g>

  <!-- Vertical Divider Line Accent -->
  <line x1="184" y1="32" x2="184" y2="148" stroke="url(#divider-gradient)" stroke-width="1.5" />

  <!-- 4. Typography Group -->
  <g transform="translate(214, 0)">
    <!-- Title -->
    <text x="0" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.8">z4j</text>

    <!-- Subtitle -->
    <text x="0" y="99" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f8fafc" letter-spacing="-0.2">The Cloud-Native Java Client for Zendesk</text>

    <!-- Tech Horizon Feature Row -->
    <text x="0" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">AOT-Compiled • Zero Reflection • Project Reactor • GraalVM Ready</text>
  </g>

  <!-- 5. Metadata Badges (Right-Aligned) -->
  <g transform="translate(756, 46)" filter="url(#badge-shadow)">
    <!-- Version / Maven Central Pill -->
    <a class="btn-pill" href="https://central.sonatype.com/artifact/lol.pbu/z4j/0.4.2" xlink:href="https://central.sonatype.com/artifact/lol.pbu/z4j/0.4.2" target="_blank">
