<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a" />
      <stop offset="45%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Blueprint Dot Grid Pattern -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.10" />
    </pattern>

    <!-- Ambient Radial Glow on Right -->
    <radialGradient id="bleed-glow" cx="82%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0091ff" stop-opacity="0.16" />
      <stop offset="65%" stop-color="#0091ff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0091ff" stop-opacity="0" />
    </radialGradient>

    <!-- Vertical Line Divider Gradient -->
    <linearGradient id="divider-gradient" x1="0" y1="32" x2="0" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0091ff" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Glow for Logo Squircle -->
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#0091ff" flood-opacity="0.4" />
    </filter>

    <!-- Inset Cutout Shadow for Logo -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feFlood flood-color="#000000" flood-opacity="0.35" result="flood" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feOffset dx="2.5" dy="3.5" in="blur" result="offset" />
      <feComposite operator="in" in="flood" in2="offset" result="comp1" />
      <feComposite operator="over" in="SourceGraphic" in2="comp1" result="comp2" />
    </filter>

    <!-- Badge Drop Shadow -->
    <filter id="badge-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Rounded Banner Clipping Path -->
    <clipPath id="banner-clip">
      <rect width="980" height="180" rx="14" ry="14" />
    </clipPath>

    <style>
      .btn-pill {
        cursor: pointer;
      }
      .btn-pill:hover rect {
        fill: #141f35;
        stroke: #38bdf8;
      }
    </style>
  </defs>

  <!-- Banner Container with Clip -->
  <g clip-path="url(#banner-clip)">
    <!-- 1. Background Layers -->
    <rect width="100%" height="100%" fill="url(#banner-bg)" />
    <rect width="100%" height="100%" fill="url(#dot-grid)" />
    <rect width="100%" height="100%" fill="url(#bleed-glow)" />

    <!-- 2. Architectural Deconstructed Bleed on Right -->
    <g transform="translate(675, -80) scale(2.15)" opacity="0.11">
      <g transform="translate(-571.4, -455.7)">
        <path fill="#0091ff" d="m 614.5293,455.6875 c -36.35333,0 -42.23392,6.5262 -42.79492,44.0625 -0.18792,1.89742 -0.28515,3.82763 -0.28516,5.78516 v 83.65039 c 0,1.95748 0.0972,3.88777 0.28516,5.78515 0.56101,37.53631 6.44157,44.0625 42.79492,44.0625 h 0.002 100.52734 0.002 c 36.35334,0 42.23389,-6.52619 42.79492,-44.0625 0.1879,-1.89738 0.28515,-3.82767 0.28515,-5.78515 v -83.65039 c 0,-1.95753 -0.0972,-3.88774 -0.28515,-5.78516 -0.56102,-37.5363 -6.4416,-44.0625 -42.79492,-44.0625 h -0.002 z m -7.48633,24.09375 h 112.88281 0.25781 c 0.95374,0 1.8159,0.40416 2.44727,1.0625 0.65811,0.63134 1.0625,1.49371 1.0625,2.44727 v 0.24804 c 10e-6,0.004 0,0.006 0,0.01 v 9.75586 103.12695 c 0,12.71252 -2.46716,26.125 -22.71094,26.125 h -3.76953 -7.95898 c -2.08762,0 -3.76758,-1.56529 -3.76758,-3.50976 v -7.17579 c 0,-1.94451 1.67996,-3.50976 3.76758,-3.50976 h 3.98047 c 10.4685,0 10.35156,-6.27529 10.35156,-11.83203 -0.001,-0.0328 -0.002,-0.0647 -0.002,-0.0977 v -97.45898 c 0,-1.36951 -0.34747,-2.15821 -2.42382,-2.15821 h -14.99414 c -1.12519,0.0476 -2.01398,0.49003 -2.66602,1.32617 l -54.82812,78.875 c -1.50875,2.19593 -0.68917,3.49209 1.07812,3.42969 h 51.61328 c 2.08762,0 3.76758,1.56526 3.76758,3.50977 v 9.6582 c 0,1.94451 -1.67996,3.51172 -3.76758,3.51172 h -76.68555 c -2.08761,0 -3.76757,-1.56721 -3.76757,-3.51172 v -7.60937 c 0,-1.52344 0.0809,-2.82195 1.05664,-4.17188 l 56.63867,-81.47851 c 2.34201,-3.01115 -0.97551,-3.53907 -1.50781,-3.53907 h -50.05469 c -2.08762,0 -3.76758,-1.56525 -3.76758,-3.50976 v -10.01367 c 0,-1.94451 1.67996,-3.50977 3.76758,-3.50977 z m 77.52148,45.88867 c 0.38146,-0.0141 0.69022,0.24502 0.69922,0.83594 v 34.80664 c -0.0885,1.56786 -0.92687,2.38558 -2.51367,2.45508 h -23.31641 c -0.9693,-2.1e-4 -1.35353,-0.66453 -0.79492,-1.64063 l 24.90039,-35.82422 c 0.29482,-0.3958 0.68882,-0.62031 1.02539,-0.63281 z" />
      </g>
    </g>

    <!-- Subtle Border Stroke Inside -->
    <rect x="0.75" y="0.75" width="978.5" height="178.5" rx="13.25" ry="13.25" fill="none" stroke="#1e293b" stroke-width="1.5" />
  </g>

  <!-- 3. Foreground Logo Mark (Left Anchor) -->
  <g transform="translate(36, 33) scale(0.62)" filter="url(#logo-glow)">
    <g transform="translate(-571.4, -455.7)">
      <!-- Crisp White Base (Squircle) -->
      <path fill="#ffffff" d="m 614.5293,455.6875 c -36.35333,0 -42.23392,6.5262 -42.79492,44.0625 -0.18792,1.89742 -0.28515,3.82763 -0.28516,5.78516 v 83.65039 c 0,1.95748 0.0972,3.88777 0.28516,5.78515 0.56101,37.53631 6.44157,44.0625 42.79492,44.0625 h 0.002 100.52734 0.002 c 36.35334,0 42.23389,-6.52619 42.79492,-44.0625 0.1879,-1.89738 0.28515,-3.82767 0.28515,-5.78515 v -83.65039 c 0,-1.95753 -0.0972,-3.88774 -0.28515,-5.78516 -0.56102,-37.5363 -6.4416,-44.0625 -42.79492,-44.0625 h -0.002 z" />
