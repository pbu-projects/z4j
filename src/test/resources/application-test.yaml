micronaut:
  http:
    services:
      zendesk:
        url: "https://test-subdomain.zendesk.com"
        email: "test@example.com"
        token: "test-token"
      zendesk-sandbox:
        url: "https://test-subdomain.sandbox.zendesk.com"
        email: "test-sandbox@example.com"
        token: "test-sandbox-token"
logger:
  levels:
    io.micronaut.http.client: TRACE

z4j:
  rate-limit:
    auto-wait-enabled: true
    wait-duration-seconds: 5
    approach-threshold: 1
