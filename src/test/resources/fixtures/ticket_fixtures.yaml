ticketData:
- subject: Chuck Norris' protocol design method has no status, requests or responses,
    only commands.
  comment: There's only one life-form as intelligent as me within thirty parsecs of
    here and that's me.
  updateComment: Here I am, brain the size of a planet, and they tell me to take you
    up to the bridge. Call that job satisfaction? 'Cos I don't.
- subject: Chuck Norris doesn't use pointers, he just points, and memory obeys.
  comment: You think you've got problems? What are you supposed to do if you are a
    manically depressed robot? No, don't try to answer that. I'm fifty thousand times
    more intelligent than you and even I don't know the answer. It gives me a headache
    just trying to think down to your level.
  updateComment: I won't enjoy it.
- subject: Chuck Norris knows the last digit of PI.
  comment: There's only one life-form as intelligent as me within thirty parsecs of
    here and that's me.
  updateComment: You think you've got problems? What are you supposed to do if you
    are a manically depressed robot? No, don't try to answer that. I'm fifty thousand
    times more intelligent than you and even I don't know the answer. It gives me
    a headache just trying to think down to your level.
- subject: Chuck Norris can access private methods.
  comment: I wish you'd just tell me rather trying to engage my enthusiasm, because
    I haven't got one.
  updateComment: I won't enjoy it.
- subject: Chuck Norris's keyboard doesn't have a Ctrl key because nothing controls
    Chuck Norris.
  comment: Pardon me for breathing, which I never do anyway so I don't know why I
    bother to say it, Oh God, I'm so depressed.
  updateComment: I won't enjoy it.
